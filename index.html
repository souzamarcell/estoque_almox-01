<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1, user-scalable=no">
<title>SysSec WMS | Gestão de Estoque e Almoxarifado</title>
<style>
/* ===================================================================
   1. RESET & VARIÁVEIS
=================================================================== */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --primary:#0d6efd; --primary-dark:#0b5ed7; --primary-light:#e7f1ff;
  --success:#198754; --success-light:#d1e7dd;
  --danger:#dc3545; --danger-light:#f8d7da;
  --warning:#ffc107; --warning-light:#fff3cd;
  --info:#0dcaf0; --info-light:#cff4fc;
  --bg:#f4f6f9; --surface:#ffffff; --border:#e2e6ec;
  --text:#1c2434; --text-muted:#6b7280;
  --sidebar-bg:#111827; --sidebar-text:#c9d2e0; --sidebar-active:#0d6efd;
  --radius:10px; --shadow:0 1px 3px rgba(16,24,40,.08),0 1px 2px rgba(16,24,40,.06);
  --shadow-lg:0 10px 30px rgba(16,24,40,.15);
  --sidebar-w:260px; --sidebar-w-collapsed:76px; --topbar-h:64px;
  --transition:.22s cubic-bezier(.4,0,.2,1);
}
[data-theme="dark"]{
  --bg:#0f1420; --surface:#171e2c; --border:#2a3242;
  --text:#e6e9f0; --text-muted:#93a0b4;
  --primary-light:#16233d; --success-light:#123326; --danger-light:#3a1620;
  --warning-light:#3a2f0d; --info-light:#0e2f38;
  --sidebar-bg:#0a0e17;
}
html,body{height:100%}
body{font-family:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;background:var(--bg);color:var(--text);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font-family:inherit;cursor:pointer}
input,select,textarea{font-family:inherit;font-size:14px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:#9aa5b5;border-radius:6px}
::-webkit-scrollbar-track{background:transparent}

/* ===================================================================
   2. LOGIN
=================================================================== */
#loginScreen{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;
  background:linear-gradient(135deg,#0b1120 0%,#0d6efd 140%);z-index:9999;padding:16px}
.login-card{background:var(--surface);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:var(--shadow-lg);text-align:center}
.login-logo{width:64px;height:64px;border-radius:14px;background:linear-gradient(135deg,var(--primary),#4dabf7);display:flex;align-items:center;justify-content:center;margin:0 auto 14px;color:#fff}
.login-card h1{font-size:19px;margin-bottom:2px}
.login-card p.sub{color:var(--text-muted);font-size:13px;margin-bottom:24px}
.field{margin-bottom:16px;text-align:left}
.field label{display:block;font-size:12.5px;font-weight:600;color:var(--text-muted);margin-bottom:6px}
.field input,.field select,.field textarea{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text);transition:border-color var(--transition)}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-light)}
.btn{border:none;border-radius:8px;padding:10px 16px;font-weight:600;font-size:13.5px;display:inline-flex;align-items:center;gap:7px;transition:all var(--transition)}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-block{width:100%;justify-content:center;padding:11px}
.btn-secondary{background:var(--border);color:var(--text)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-outline{background:transparent;border:1px solid var(--border);color:var(--text)}
.btn-sm{padding:6px 10px;font-size:12px}
.login-hint{margin-top:18px;font-size:11.5px;color:var(--text-muted);background:var(--bg);padding:8px;border-radius:8px}
.login-error{background:var(--danger-light);color:var(--danger);padding:9px;border-radius:8px;font-size:12.5px;margin-bottom:14px;display:none}

/* ===================================================================
   3. APP SHELL
=================================================================== */
#app{display:none}
.shell{display:flex;min-height:100vh}
.sidebar{width:var(--sidebar-w);background:var(--sidebar-bg);color:var(--sidebar-text);flex-shrink:0;
  display:flex;flex-direction:column;transition:width var(--transition);position:fixed;top:0;bottom:0;left:0;z-index:400;overflow:hidden}
.sidebar.collapsed{width:var(--sidebar-w-collapsed)}
.sidebar-head{height:var(--topbar-h);display:flex;align-items:center;gap:10px;padding:0 18px;flex-shrink:0;border-bottom:1px solid rgba(255,255,255,.08)}
.sidebar-head .logo-box{width:34px;height:34px;border-radius:8px;background:linear-gradient(135deg,var(--primary),#4dabf7);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.sidebar-head .brand{font-weight:700;font-size:15px;color:#fff;white-space:nowrap;overflow:hidden}
.sidebar-nav{flex:1;overflow-y:auto;padding:10px 0}
.nav-group-label{padding:14px 20px 6px;font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:#6b7688;white-space:nowrap}
.nav-item{display:flex;align-items:center;gap:12px;padding:10px 20px;color:var(--sidebar-text);font-size:13.5px;font-weight:500;white-space:nowrap;position:relative;transition:background var(--transition)}
.nav-item svg{flex-shrink:0;width:18px;height:18px}
.nav-item:hover{background:rgba(255,255,255,.06);color:#fff}
.nav-item.active{background:rgba(13,110,253,.18);color:#fff}
.nav-item.active::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sidebar-active)}
.sidebar.collapsed .brand,.sidebar.collapsed .nav-group-label,.sidebar.collapsed .nav-label{display:none}
.sidebar.collapsed .nav-item{justify-content:center;padding:12px 0}
.sidebar-foot{padding:12px;border-top:1px solid rgba(255,255,255,.08)}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:390}
.overlay.show{display:block}

.main{flex:1;margin-left:var(--sidebar-w);transition:margin-left var(--transition);display:flex;flex-direction:column;min-width:0}
.main.collapsed{margin-left:var(--sidebar-w-collapsed)}
.topbar{height:var(--topbar-h);background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 20px;position:sticky;top:0;z-index:200}
.hamburger{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.hamburger svg{width:18px;height:18px}
.topbar-search{flex:1;max-width:420px;position:relative}
.topbar-search input{width:100%;padding:9px 12px 9px 36px;border:1px solid var(--border);border-radius:8px;background:var(--bg);color:var(--text)}
.topbar-search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);width:15px;height:15px;color:var(--text-muted)}
.search-results{position:absolute;top:110%;left:0;right:0;background:var(--surface);border:1px solid var(--border);border-radius:8px;box-shadow:var(--shadow-lg);max-height:320px;overflow-y:auto;z-index:300;display:none}
.search-results.show{display:block}
.search-result-item{padding:10px 12px;border-bottom:1px solid var(--border);font-size:13px;cursor:pointer}
.search-result-item:hover{background:var(--bg)}
.search-result-item small{display:block;color:var(--text-muted);font-size:11px}
.topbar-right{margin-left:auto;display:flex;align-items:center;gap:10px}
.icon-btn{width:38px;height:38px;border-radius:8px;border:1px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;position:relative}
.icon-btn svg{width:17px;height:17px}
.badge-dot{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--danger)}
.user-chip{display:flex;align-items:center;gap:8px;padding:6px 10px 6px 6px;border-radius:20px;background:var(--bg);border:1px solid var(--border);cursor:pointer}
.user-avatar{width:28px;height:28px;border-radius:50%;background:var(--primary);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700}
.user-chip .uname{font-size:12.5px;font-weight:600}
.user-chip .urole{font-size:10.5px;color:var(--text-muted)}

.content{padding:22px;flex:1}
.breadcrumb{font-size:12.5px;color:var(--text-muted);margin-bottom:6px;display:flex;gap:6px;align-items:center}
.page-title{font-size:21px;font-weight:700;margin-bottom:18px;display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px}
.page-title .actions{display:flex;gap:8px;flex-wrap:wrap}

/* ===================================================================
   4. CARDS / GRID / KPI
=================================================================== */
.grid{display:grid;gap:16px}
.kpi-grid{grid-template-columns:repeat(auto-fit,minmax(200px,1fr));margin-bottom:20px}
.kpi-card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px}
.kpi-card .kpi-top{display:flex;justify-content:space-between;align-items:flex-start}
.kpi-icon{width:38px;height:38px;border-radius:9px;display:flex;align-items:center;justify-content:center}
.kpi-icon svg{width:19px;height:19px}
.kpi-value{font-size:24px;font-weight:800}
.kpi-label{color:var(--text-muted);font-size:12.5px;font-weight:600}
.kpi-trend{font-size:11.5px;font-weight:600}
.kpi-trend.up{color:var(--success)}
.kpi-trend.down{color:var(--danger)}

.panel{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.panel-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.panel-head h3{font-size:14.5px;font-weight:700}
.dash-grid{grid-template-columns:2fr 1fr}
.dash-grid2{grid-template-columns:1fr 1fr}
@media (max-width:960px){.dash-grid,.dash-grid2{grid-template-columns:1fr}}

.alert-item{display:flex;gap:10px;padding:9px 0;border-bottom:1px solid var(--border);align-items:flex-start}
.alert-item:last-child{border-bottom:none}
.alert-dot{width:8px;height:8px;border-radius:50%;margin-top:5px;flex-shrink:0}
.alert-txt strong{display:block;font-size:12.8px}
.alert-txt span{font-size:11.5px;color:var(--text-muted)}

/* ===================================================================
   5. TABELAS / TOOLBAR / PAGINAÇÃO
=================================================================== */
.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;justify-content:space-between}
.toolbar-left{display:flex;gap:10px;flex-wrap:wrap;align-items:center;flex:1}
.toolbar input[type=text],.toolbar select{padding:8px 11px;border:1px solid var(--border);border-radius:8px;background:var(--surface);color:var(--text)}
.table-wrap{overflow-x:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{width:100%;border-collapse:collapse;min-width:640px}
thead th{background:var(--bg);text-align:left;padding:11px 14px;font-size:11.5px;text-transform:uppercase;letter-spacing:.03em;color:var(--text-muted);border-bottom:1px solid var(--border);white-space:nowrap;cursor:pointer;user-select:none}
thead th:hover{color:var(--primary)}
tbody td{padding:11px 14px;border-bottom:1px solid var(--border);font-size:13px;white-space:nowrap}
tbody tr:last-child td{border-bottom:none}
tbody tr:hover{background:var(--bg)}
.row-actions{display:flex;gap:6px}
.icon-sm{width:30px;height:30px;border-radius:7px;border:1px solid var(--border);background:var(--surface);display:inline-flex;align-items:center;justify-content:center}
.icon-sm svg{width:14px;height:14px}
.icon-sm:hover{background:var(--bg)}
.pagination{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-size:12.5px;color:var(--text-muted)}
.pagination .pg-btns{display:flex;gap:6px}
.badge{display:inline-flex;align-items:center;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:700}
.badge-success{background:var(--success-light);color:var(--success)}
.badge-danger{background:var(--danger-light);color:var(--danger)}
.badge-warning{background:var(--warning-light);color:#92730b}
.badge-info{background:var(--info-light);color:#087990}
.badge-muted{background:var(--border);color:var(--text-muted)}
.empty-state{text-align:center;padding:50px 20px;color:var(--text-muted)}
.empty-state svg{width:46px;height:46px;margin-bottom:10px;opacity:.5}

/* ===================================================================
   6. MODAL / TOAST
=================================================================== */
.modal-backdrop{position:fixed;inset:0;background:rgba(15,20,32,.55);z-index:800;display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.show{display:flex}
.modal{background:var(--surface);border-radius:14px;width:100%;max-width:640px;max-height:90vh;display:flex;flex-direction:column;box-shadow:var(--shadow-lg)}
.modal.modal-lg{max-width:820px}
.modal.modal-sm{max-width:420px}
.modal-head{display:flex;justify-content:space-between;align-items:center;padding:18px 20px;border-bottom:1px solid var(--border)}
.modal-head h3{font-size:16px}
.modal-close{width:32px;height:32px;border-radius:8px;border:none;background:var(--bg);display:flex;align-items:center;justify-content:center}
.modal-body{padding:20px;overflow-y:auto}
.modal-foot{padding:16px 20px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:10px}
.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.form-grid .full{grid-column:1/-1}
@media (max-width:560px){.form-grid{grid-template-columns:1fr}}

#toastContainer{position:fixed;top:18px;right:18px;z-index:999;display:flex;flex-direction:column;gap:10px}
.toast{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--primary);border-radius:8px;padding:12px 16px;box-shadow:var(--shadow-lg);min-width:260px;max-width:340px;font-size:13px;animation:slideIn .25s ease}
.toast.success{border-left-color:var(--success)}
.toast.error{border-left-color:var(--danger)}
.toast.warning{border-left-color:var(--warning)}
@keyframes slideIn{from{transform:translateX(30px);opacity:0}to{transform:translateX(0);opacity:1}}

/* ===================================================================
   7. RESPONSIVIDADE
=================================================================== */
@media (max-width:900px){
  .sidebar{transform:translateX(-100%);width:270px}
  .sidebar.mobile-open{transform:translateX(0)}
  .main,.main.collapsed{margin-left:0}
  .topbar-search{max-width:none}
  .kpi-grid{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
}
@media (max-width:560px){
  .content{padding:14px}
  .topbar{padding:0 12px}
  .topbar-search{display:none}
  .page-title{font-size:18px}
  .login-card{padding:28px 22px}
}
.hidden{display:none !important}
.text-muted{color:var(--text-muted)}
.text-danger{color:var(--danger)}
.text-success{color:var(--success)}
.mt8{margin-top:8px}.mt16{margin-top:16px}.mb8{margin-bottom:8px}
@media print{
  .sidebar,.topbar,.toolbar,.row-actions,.page-title .actions,#toastContainer{display:none !important}
  .main{margin-left:0 !important}
  body{background:#fff}
}
</style>
</head>
<body>

<!-- =====================================================================
     LOGIN SCREEN
===================================================================== -->
<div id="loginScreen">
  <div class="login-card">
    <div class="login-logo">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 7.28a1 1 0 0 0-.5-.86L12.5 2.14a1 1 0 0 0-1 0L4 6.42a1 1 0 0 0-.5.86v9.44a1 1 0 0 0 .5.86l7.5 4.28a1 1 0 0 0 1 0l7.5-4.28a1 1 0 0 0 .5-.86Z"/><path d="m3.5 7.28 8.5 4.9 8.5-4.9M12 22V12.2"/></svg>
    </div>
    <h1>SysSec WMS</h1>
    <p class="sub">Gestão de Estoque &amp; Almoxarifado</p>
    <div class="login-error" id="loginError">Usuário ou senha inválidos.</div>
    <form id="loginForm" autocomplete="off">
      <div class="field"><label>Usuário</label><input type="text" id="loginUser" placeholder="Admin" required></div>
      <div class="field"><label>Senha</label><input type="password" id="loginPass" placeholder="••••••••" required></div>
      <button type="submit" class="btn btn-primary btn-block">Entrar</button>
    </form>
    <div class="login-hint">Usuário padrão: <strong>Admin</strong> &nbsp;|&nbsp; Senha: <strong>123</strong></div>
  </div>
</div>

<!-- =====================================================================
     APP SHELL
===================================================================== -->
<div id="app">
<div class="overlay" id="overlay"></div>
<div class="shell">

  <aside class="sidebar" id="sidebar">
    <div class="sidebar-head">
      <div class="logo-box"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 7.28a1 1 0 0 0-.5-.86L12.5 2.14a1 1 0 0 0-1 0L4 6.42a1 1 0 0 0-.5.86v9.44a1 1 0 0 0 .5.86l7.5 4.28a1 1 0 0 0 1 0l7.5-4.28a1 1 0 0 0 .5-.86Z"/><path d="m3.5 7.28 8.5 4.9 8.5-4.9M12 22V12.2"/></svg></div>
      <span class="brand" id="brandName">SysSec WMS</span>
    </div>
    <nav class="sidebar-nav" id="sidebarNav"></nav>
    <div class="sidebar-foot">
      <button class="btn btn-outline btn-block btn-sm" id="btnLogoutSide" style="color:#c9d2e0;border-color:rgba(255,255,255,.15)">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5M21 12H9"/></svg>
        <span class="nav-label">Sair</span>
      </button>
    </div>
  </aside>

  <div class="main" id="mainWrap">
    <header class="topbar">
      <button class="hamburger" id="btnHamburger">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h18M3 6h18M3 18h18"/></svg>
      </button>
      <div class="topbar-search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="globalSearch" placeholder="Pesquisar produto, código, fornecedor, lote...">
        <div class="search-results" id="searchResults"></div>
      </div>
      <div class="topbar-right">
        <button class="icon-btn" id="btnThemeToggle" title="Alternar tema">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        </button>
        <button class="icon-btn" id="btnAlerts" title="Alertas">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 8a6 6 0 0 1 12 0c0 7 3 9 3 9H3s3-2 3-9"/><path d="M10.3 21a1.94 1.94 0 0 0 3.4 0"/></svg>
          <span class="badge-dot" id="alertDot"></span>
        </button>
        <div class="user-chip" id="userChip">
          <div class="user-avatar" id="userAvatar">A</div>
          <div>
            <div class="uname" id="userName">Admin</div>
            <div class="urole" id="userRole">Administrador</div>
          </div>
        </div>
      </div>
    </header>
    <main class="content" id="viewContainer"></main>
  </div>
</div>
</div>

<!-- MODAL -->
<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalBox">
    <div class="modal-head">
      <h3 id="modalTitle">Título</h3>
      <button class="modal-close" id="modalCloseBtn">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
      </button>
    </div>
    <div class="modal-body" id="modalBody"></div>
    <div class="modal-foot" id="modalFoot"></div>
  </div>
</div>

<div id="toastContainer"></div>

<script>
/* =====================================================================
   SECTION A — CONFIGURAÇÃO GERAL, BANCO DE DADOS (LocalStorage)
===================================================================== */
const DB_KEYS = ["usuarios","produtos","categorias","fornecedores","entradas","saidas","transferencias",
  "inventarios","ajustes","movimentacoes","lotes","localizacoes","auditoria","configuracoes"];
const LS_PREFIX = "wms_";
const SEED_FLAG = LS_PREFIX+"seed_loaded";
const SESSION_KEY = LS_PREFIX+"session";
const SIDEBAR_KEY = LS_PREFIX+"sidebar_collapsed";
const INACTIVITY_LIMIT_MIN = 20;

function dbGet(key){ try{ return JSON.parse(localStorage.getItem(LS_PREFIX+key)) || []; }catch(e){ return []; } }
function dbSet(key,val){ localStorage.setItem(LS_PREFIX+key, JSON.stringify(val)); }
function dbGetObj(key,fallback){ try{ const v=JSON.parse(localStorage.getItem(LS_PREFIX+key)); return v||fallback; }catch(e){ return fallback; } }
function nextId(key){ const arr=dbGet(key); return arr.length? Math.max(...arr.map(r=>r.id))+1 : 1; }
function pad(n,len){ return String(n).padStart(len,"0"); }
function fmtMoney(v){ const cur = (dbGetObj("configuracoes",{}).moeda)||"BRL"; const sym = cur==="BRL"?"R$":(cur==="USD"?"US$":"€"); return sym+" "+Number(v||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2}); }
function fmtDate(d){ if(!d) return "-"; const dt=new Date(d+"T00:00:00"); if(isNaN(dt)) return d; return dt.toLocaleDateString('pt-BR'); }
function todayISO(){ return new Date().toISOString().slice(0,10); }
function nowTime(){ return new Date().toLocaleTimeString('pt-BR'); }
function daysBetween(a,b){ return Math.round((new Date(b)-new Date(a))/86400000); }
function uid(){ return Math.random().toString(36).slice(2,10); }

function ensureStructures(){

function ensureAdminUser(){
  let users = dbGet("usuarios");
  if(!users.find(u=>u.usuario==="Admin")){

function registrarAuditoria(acao,tela){
  const list=dbGet("auditoria");
  const u = getSessionUser();
  list.unshift({id:nextId("auditoria"),usuario:u?u.usuario:"sistema",data:todayISO(),hora:nowTime(),acao:acao,tela:tela,navegador:navigator.userAgent.split(" ").slice(-1)[0]||"Navegador"});
  dbSet("auditoria",list);
}
function toast(msg,type="success"){
  const c=document.getElementById("toastContainer");
  const el=document.createElement("div");
  el.className="toast "+type;
  el.textContent=msg;
  c.appendChild(el);
  setTimeout(()=>{ el.style.opacity="0"; el.style.transition="opacity .3s"; setTimeout(()=>el.remove(),300); },3200);
}
function confirmModal(msg,onYes){
  openModal("Confirmação", `<p>${msg}</p>`, [
    {label:"Cancelar",cls:"btn-secondary",action:closeModal},
    {label:"Confirmar",cls:"btn-danger",action:()=>{closeModal();onYes();}}
  ]);
}
function openModal(title,bodyHtml,buttons,size=""){
  document.getElementById("modalTitle").textContent=title;
  document.getElementById("modalBody").innerHTML=bodyHtml;
  const foot=document.getElementById("modalFoot");
  foot.innerHTML="";
  (buttons||[]).forEach(b=>{
    const btn=document.createElement("button");
    btn.className="btn "+(b.cls||"btn-secondary");
    btn.textContent=b.label;
    btn.onclick=b.action;
    foot.appendChild(btn);
  });
  const box=document.getElementById("modalBox");
  box.className="modal "+size;
  document.getElementById("modalBackdrop").classList.add("show");
}
function closeModal(){ document.getElementById("modalBackdrop").classList.remove("show"); }
document.getElementById("modalCloseBtn").onclick=closeModal;
document.getElementById("modalBackdrop").addEventListener("click",e=>{ if(e.target.id==="modalBackdrop") closeModal(); });

===================================================================== */
function getSessionUser(){ return dbGetObj("session_current",null) || JSON.parse(sessionStorage.getItem(SESSION_KEY)||"null"); }
function setSessionUser(user){ sessionStorage.setItem(SESSION_KEY, JSON.stringify({usuario:user.usuario,nome:user.nome,perfil:user.perfil,loginAt:Date.now()})); }
function clearSessionUser(){ sessionStorage.removeItem(SESSION_KEY); }
function getSessionUser(){ try{ return JSON.parse(sessionStorage.getItem(SESSION_KEY)); }catch(e){ return null; } }

let inactivityTimer=null;
function resetInactivityTimer(){
  clearTimeout(inactivityTimer);
  inactivityTimer=setTimeout(()=>{ doLogout(true); }, INACTIVITY_LIMIT_MIN*60*1000);
}
["click","mousemove","keydown","touchstart"].forEach(evt=>document.addEventListener(evt,()=>{ if(getSessionUser()) resetInactivityTimer(); }));

document.getElementById("loginForm").addEventListener("submit",function(e){
  e.preventDefault();
  const u=document.getElementById("loginUser").value.trim();
  const p=document.getElementById("loginPass").value;
  const users=dbGet("usuarios");
  const found=users.find(x=>x.usuario===u && x.senha===p);
  const errBox=document.getElementById("loginError");
  if(!found){ errBox.style.display="block"; errBox.textContent="Usuário ou senha inválidos."; return; }
  if(found.status==="Inativo"){ errBox.style.display="block"; errBox.textContent="Usuário inativo. Contate o administrador."; return; }
  errBox.style.display="none";
  setSessionUser(found);
  registrarAuditoria("Login","Login");
  document.getElementById("loginScreen").style.display="none";
  document.getElementById("app").style.display="block";
  bootApp();
});

function doLogout(byInactivity){
  if(getSessionUser()) registrarAuditoria("Logout","Logout");
  clearSessionUser();
  document.getElementById("app").style.display="none";
  document.getElementById("loginScreen").style.display="flex";
  document.getElementById("loginForm").reset();
  if(byInactivity) toast("Sessão encerrada por inatividade.","warning");
}
document.getElementById("btnLogoutSide").onclick=()=>doLogout(false);

function svgIcon(name){ return `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.info}</svg>`; }

let currentView="dashboard";
function renderSidebar(){
  const nav=document.getElementById("sidebarNav");
  nav.innerHTML="";
  MENU.forEach(g=>{
    const label=document.createElement("div"); label.className="nav-group-label"; label.textContent=g.group;
    nav.appendChild(label);
    g.items.forEach(it=>{
      const a=document.createElement("a");
      a.href="#"; a.className="nav-item"+(it.id===currentView?" active":"");
      a.dataset.view=it.id;
      a.innerHTML=svgIcon(it.icon)+`<span class="nav-label">${it.label}</span>`;
      a.onclick=(e)=>{ e.preventDefault(); navigateTo(it.id); if(window.innerWidth<=900) closeSidebarMobile(); };
      nav.appendChild(a);
    });
  });
}
function closeSidebarMobile(){ document.getElementById("sidebar").classList.remove("mobile-open"); document.getElementById("overlay").classList.remove("show"); }
document.getElementById("btnHamburger").onclick=()=>{
  if(window.innerWidth<=900){
    document.getElementById("sidebar").classList.toggle("mobile-open");
    document.getElementById("overlay").classList.toggle("show");
  }else{
    const sb=document.getElementById("sidebar"); const main=document.getElementById("mainWrap");
    sb.classList.toggle("collapsed"); main.classList.toggle("collapsed");
    localStorage.setItem(SIDEBAR_KEY, sb.classList.contains("collapsed")?"1":"0");
  }
};
document.getElementById("overlay").onclick=closeSidebarMobile;

function navigateTo(view){
  currentView=view;
  renderSidebar();
  renderView(view);
  window.scrollTo(0,0);
}

/* ---- Estado de tabela genérico (busca, ordenação, paginação) por módulo ---- */
const tableState = {};
function getTableState(mod){
  if(!tableState[mod]) tableState[mod] = {search:"",sortCol:null,sortDir:1,page:1,pageSize:8};
  return tableState[mod];
}

function renderCrudView(modKey){
  const mod = MODULES[modKey];
  const st = getTableState(modKey);
  let data = dbGet(modKey).slice();
  if(st.search){
    const s=st.search.toLowerCase();
    data = data.filter(r=> JSON.stringify(r).toLowerCase().includes(s));
  }
  if(st.sortCol){
    data.sort((a,b)=>{
      let va=a[st.sortCol], vb=b[st.sortCol];
      if(typeof va==="number"&&typeof vb==="number") return (va-vb)*st.sortDir;
      return String(va||"").localeCompare(String(vb||""))*st.sortDir;
    });
  } else {
    data.sort((a,b)=>b.id-a.id);
  }
  const totalPages = Math.max(1,Math.ceil(data.length/st.pageSize));
  st.page = Math.min(st.page,totalPages);
  const pageData = data.slice((st.page-1)*st.pageSize, st.page*st.pageSize);

  let html = `
  <div class="breadcrumb">Início / ${mod.title}</div>
  <div class="page-title"><span>${svgIconInline(mod.icon)} ${mod.title}</span>
    <div class="actions">
      <button class="btn btn-outline btn-sm" onclick="exportModuleCSV('${modKey}')">Exportar CSV</button>
      <button class="btn btn-outline btn-sm" onclick="window.print()">Imprimir</button>
      <button class="btn btn-primary btn-sm" onclick="openCrudForm('${modKey}',null)">+ Novo</button>

  <div class="toolbar">
    <div class="toolbar-left">
      <input type="text" placeholder="Pesquisar..." value="${st.search}" oninput="tableState['${modKey}'].search=this.value;tableState['${modKey}'].page=1;renderView('${modKey}')">
      <span class="text-muted" style="font-size:12.5px">${data.length} registro(s)</span>
    </div>
  </div>
  <div class="table-wrap"><table><thead><tr>`;
  mod.cols.forEach(c=>{ html+=`<th onclick="sortCol('${modKey}','${c[0]}')">${c[1]} ${st.sortCol===c[0]?(st.sortDir===1?'▲':'▼'):''}</th>`; });
  html += `<th style="text-align:right">Ações</th></tr></thead><tbody>`;
  if(pageData.length===0){
    html += `<tr><td colspan="${mod.cols.length+1}"><div class="empty-state"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M8 7V5a4 4 0 0 1 8 0v2"/></svg><div>Nenhum registro encontrado</div></div></td></tr>`;
  }
  pageData.forEach(r=>{
    html += "<tr>";
    mod.cols.forEach(c=>{
      let val = c[2] ? c[2](r[c[0]]) : r[c[0]];
      if(c[0]==="status") val = badgeStatus(val);
      if(c[0]==="situacao") val = badgeSituacao(val);
      html += `<td>${val!==undefined?val:"-"}</td>`;
    });
    html += `<td><div class="row-actions" style="justify-content:flex-end">
      <button class="icon-sm" title="Visualizar" onclick="viewCrudRecord('${modKey}',${r.id})">${svgSmallEye()}</button>
      <button class="icon-sm" title="Editar" onclick="openCrudForm('${modKey}',${r.id})">${svgSmallEdit()}</button>
      <button class="icon-sm" title="Excluir" onclick="deleteCrudRecord('${modKey}',${r.id})">${svgSmallTrash()}</button>
    </div></td></tr>`;
  });
  html += `</tbody></table>
    <div class="pagination">
      <span>Página ${st.page} de ${totalPages}</span>
      <div class="pg-btns">
        <button class="btn btn-outline btn-sm" ${st.page<=1?"disabled":""} onclick="tableState['${modKey}'].page--;renderView('${modKey}')">Anterior</button>
        <button class="btn btn-outline btn-sm" ${st.page>=totalPages?"disabled":""} onclick="tableState['${modKey}'].page++;renderView('${modKey}')">Próxima</button>
      </div>
    </div>
  </div>`;
  document.getElementById("viewContainer").innerHTML = html;
}
function svgIconInline(name){ return svgIcon(name).replace('viewBox="0 0 24 24"','viewBox="0 0 24 24" width="20" height="20" style="vertical-align:-4px;margin-right:4px"'); }
function svgSmallEye(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7Z"/><circle cx="12" cy="12" r="3"/></svg>'; }
function svgSmallEdit(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>'; }
function svgSmallTrash(){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18"/><path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2m3 0-1 14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2L4 6"/></svg>'; }
function badgeStatus(v){ if(v==="Ativo") return `<span class="badge badge-success">Ativo</span>`; if(v==="Inativo") return `<span class="badge badge-muted">Inativo</span>`; return v; }
function badgeSituacao(v){
  if(v==="Vencido") return `<span class="badge badge-danger">Vencido</span>`;
  if(v==="Próximo ao Vencimento") return `<span class="badge badge-warning">Próximo ao Vencimento</span>`;
  if(v==="Regular") return `<span class="badge badge-success">Regular</span>`;
  return `<span class="badge badge-muted">${v}</span>`;
}
function sortCol(mod,col){ const st=getTableState(mod); if(st.sortCol===col){ st.sortDir*=-1; } else { st.sortCol=col; st.sortDir=1; } renderView(mod); }

function buildFieldHtml(f,val){
  const req = f.req?"required":"";
  const value = val!==undefined&&val!==null?val:"";
  if(f.type==="select"){
    return `<select name="${f.name}" ${req}>${f.options.map(o=>`<option ${o===value?"selected":""}>${o}</option>`).join("")}</select>`;
  }
  if(f.type==="select-dyn"){
    const list=f.source();
    return `<select name="${f.name}" ${req}><option value="">Selecione...</option>${opcoes(list,f.vf,f.lf,value)}</select>`;
  }
  if(f.type==="textarea"){
    return `<textarea name="${f.name}" rows="3">${value}</textarea>`;
  }
  return `<input type="${f.type}" name="${f.name}" value="${value}" ${req} ${f.step?`step="${f.step}"`:""}>`;
}

function openCrudForm(modKey,id){
  const mod = MODULES[modKey];
  const isEdit = !!id;
  const rec = isEdit ? dbGet(modKey).find(r=>r.id===id) : {};
  let html = `<form id="crudForm" class="form-grid">`;
  mod.fields.forEach(f=>{
    let val = rec[f.name];
    if(f.auto && !isEdit) val = "(gerado automaticamente)";
    html += `<div class="field ${f.full?"full":""}"><label>${f.label}</label>${buildFieldHtml(f, isEdit?rec[f.name]:(f.type==="date"?todayISO():""))}</div>`;
  });
  html += `</form>`;
  openModal((isEdit?"Editar":"Novo")+" — "+mod.title, html, [
    {label:"Cancelar",cls:"btn-secondary",action:closeModal},
    {label:"Salvar",cls:"btn-primary",action:()=>saveCrudForm(modKey,id)}
  ],"modal-lg");
}

function saveCrudForm(modKey,id){
  const mod = MODULES[modKey];
  const form = document.getElementById("crudForm");
  const fd = new FormData(form);
  const rec = id ? dbGet(modKey).find(r=>r.id===id) : {};
  mod.fields.forEach(f=>{
    let v = fd.get(f.name);
    if(f.type==="number") v = v===""?0:Number(v);
    if(!f.auto || id) rec[f.name]=v;
  });
  let list = dbGet(modKey);
  try{
    if(!id){
      rec.id = nextId(modKey);
      if(mod.fields.find(x=>x.name==="codigo"&&x.auto)) rec.codigo = "PRD-"+pad(rec.id,4);
      if(mod.fields.find(x=>x.name==="numero"&&x.auto)) rec.numero = modKey.slice(0,3).toUpperCase()+"-"+pad(new Date().getFullYear(),4)+pad(rec.id,4);
      if(mod.onSave) mod.onSave(rec);
      list.push(rec);
      registrarAuditoria("Inclusão",mod.title);
    } else {
      const idx = list.findIndex(r=>r.id===id);
      if(mod.onSave && ["entradas","saidas","transferencias","ajustes","inventarios"].includes(modKey)){
        // Para movimentações, não reexecuta o efeito de estoque na edição simples para evitar duplicidade — apenas atualiza os dados cadastrais.
      }
      list[idx] = rec;
      registrarAuditoria("Alteração",mod.title);
    }
  }catch(err){
    return; // erro já reportado via toast (ex.: estoque negativo bloqueado)
  }
  dbSet(modKey,list);
  closeModal();
  toast(id?"Registro atualizado com sucesso.":"Registro criado com sucesso.");
  renderView(modKey);
}

function viewCrudRecord(modKey,id){
  const mod=MODULES[modKey];
  const rec=dbGet(modKey).find(r=>r.id===id);
  if(!rec) return;
  let html = `<div class="form-grid">`;
  mod.fields.forEach(f=>{
    let val = rec[f.name];
    if(f.type==="select-dyn") val = f.lf==="nome"?nomeFieldLookup(f,val):val;
    html += `<div class="field ${f.full?"full":""}"><label>${f.label}</label><div style="padding:9px 0;font-weight:600">${val!==undefined&&val!==""?val:"-"}</div></div>`;
  });
  html += `</div>`;
  openModal("Visualizar — "+mod.title, html, [{label:"Fechar",cls:"btn-secondary",action:closeModal}],"modal-lg");
}
function nomeFieldLookup(f,val){ const item=f.source().find(x=>x[f.vf]==val); return item?item[f.lf]:val; }

function deleteCrudRecord(modKey,id){
  confirmModal("Tem certeza que deseja excluir este registro? Esta ação não pode ser desfeita.",()=>{
    let list = dbGet(modKey).filter(r=>r.id!==id);
    dbSet(modKey,list);
    registrarAuditoria("Exclusão",MODULES[modKey].title);
    toast("Registro excluído com sucesso.");
    renderView(modKey);
  });
}

function exportModuleCSV(modKey){
  const mod=MODULES[modKey];
  const data=dbGet(modKey);
  if(!data.length){ toast("Não há dados para exportar.","warning"); return; }
  const headers = Object.keys(data[0]);
  let csv = headers.join(";")+"\n";
  data.forEach(r=>{ csv += headers.map(h=>String(r[h]!==undefined?r[h]:"").replace(/;/g,",")).join(";")+"\n"; });
  downloadFile(csv, modKey+"-"+todayISO()+".csv","text/csv");
  registrarAuditoria("Exportação",mod.title);
}
function downloadFile(content,filename,type){
  const blob = new Blob([content],{type});
  const url = URL.createObjectURL(blob);
  const a=document.createElement("a"); a.href=url; a.download=filename; document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
}

function renderDashboard(){
  const produtos=produtosList(), entradas=dbGet("entradas"), saidas=dbGet("saidas"), transferencias=dbGet("transferencias");
  const lotes=lotesList(), inventarios=dbGet("inventarios"), movimentacoes=dbGet("movimentacoes");
  const mesAtual = new Date().getMonth();
  const entradasMes = entradas.filter(e=>new Date(e.data+"T00:00:00").getMonth()===mesAtual).length;
  const saidasMes = saidas.filter(s=>new Date(s.data+"T00:00:00").getMonth()===mesAtual).length;
  const abaixoMin = produtos.filter(p=>Number(p.estoqueAtual)<Number(p.estoqueMin));
  const vencendo = lotes.filter(l=>{ const d=daysBetween(todayISO(),l.dataValidade); return d>=0 && d<=90; });
  const vencidos = lotes.filter(l=>daysBetween(todayISO(),l.dataValidade)<0);
  const valorTotalEstoque = produtos.reduce((s,p)=>s+Number(p.estoqueAtual)*Number(p.valorMedio||p.valorCompra||0),0);
  const invPendentes = inventarios.filter(i=>i.diferenca!==0).length;

  const kpis = [
    ["Total de Produtos",produtos.length,"box","primary"],
    ["Estoque Atual (unid.)",produtos.reduce((s,p)=>s+Number(p.estoqueAtual),0),"grid","info"],
    ["Entradas do Mês",entradasMes,"in","success"],
    ["Saídas do Mês",saidasMes,"out","danger"],
    ["Transferências",transferencias.length,"swap","info"],
    ["Abaixo do Mínimo",abaixoMin.length,"tune","warning"],
    ["Vencendo (90d)",vencendo.length,"cal","warning"],
    ["Produtos Vencidos",vencidos.length,"shield","danger"],
    ["Valor em Estoque",fmtMoney(valorTotalEstoque),"chart","success"],
    ["Inventários c/ Diferença",invPendentes,"clip","info"],
  ];
  let kpiHtml = `<div class="grid kpi-grid">`;
  kpis.forEach(k=>{
    kpiHtml += `<div class="kpi-card">
      <div class="kpi-top"><div class="kpi-icon" style="background:var(--${k[3]}-light);color:var(--${k[3]})">${svgIcon(k[2])}</div></div>
      <div class="kpi-value">${k[1]}</div><div class="kpi-label">${k[0]}</div>
    </div>`;
  });
  kpiHtml += `</div>`;

  // Ranking produtos mais movimentados
  const rank = {};
  movimentacoes.forEach(m=>{ rank[m.produtoId] = (rank[m.produtoId]||0)+Math.abs(Number(m.quantidade)); });
  const ranked = Object.entries(rank).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const maxRank = ranked.length?ranked[0][1]:1;
  let rankHtml = ranked.map(([pid,qty])=>{
    const nome = nomeProduto(pid);
    const pct = Math.round((qty/maxRank)*100);
    return `<div style="margin-bottom:10px">
      <div style="display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:4px"><span>${nome}</span><strong>${qty}</strong></div>
      <div style="background:var(--bg);border-radius:6px;height:8px;overflow:hidden"><div style="width:${pct}%;height:100%;background:var(--primary)"></div></div>
    </div>`;
  }).join("") || `<div class="text-muted">Sem movimentações registradas.</div>`;

  // Últimas movimentações
  let movHtml = movimentacoes.slice(0,6).map(m=>`
    <div class="alert-item"><div class="alert-dot" style="background:var(--primary)"></div>
      <div class="alert-txt"><strong>${m.tipo} — ${nomeProduto(m.produtoId)}</strong><span>${fmtDate(m.data)} • Qtd ${m.quantidade} • ${m.usuario}</span></div>
    </div>`).join("") || `<div class="text-muted">Nenhuma movimentação.</div>`;

  // Alertas
  let alertHtml = "";
  abaixoMin.slice(0,4).forEach(p=>alertHtml+=`<div class="alert-item"><div class="alert-dot" style="background:var(--warning)"></div><div class="alert-txt"><strong>${p.nome}</strong><span>Estoque atual ${p.estoqueAtual} abaixo do mínimo ${p.estoqueMin}</span></div></div>`);
  vencidos.slice(0,4).forEach(l=>alertHtml+=`<div class="alert-item"><div class="alert-dot" style="background:var(--danger)"></div><div class="alert-txt"><strong>Lote ${l.numeroLote} vencido</strong><span>${nomeProduto(l.produtoId)} • Venceu em ${fmtDate(l.dataValidade)}</span></div></div>`);
  if(!alertHtml) alertHtml = `<div class="text-muted">Nenhum alerta no momento.</div>`;

  // Gráfico SVG simples: entradas x saídas últimos 7 registros
  const barData = [];
  for(let i=6;i>=0;i--){ const d=new Date(); d.setDate(d.getDate()-i); const iso=d.toISOString().slice(0,10);
    barData.push({label:d.toLocaleDateString('pt-BR',{weekday:'short'}),
      ent: entradas.filter(e=>e.data===iso).length, sai: saidas.filter(s=>s.data===iso).length}); }
  const maxBar = Math.max(1,...barData.map(b=>Math.max(b.ent,b.sai)));
  let svgChart = `<svg viewBox="0 0 350 140" width="100%" height="150">`;
  barData.forEach((b,i)=>{
    const x=i*50+15;
    const hE = (b.ent/maxBar)*90, hS=(b.sai/maxBar)*90;
    svgChart += `<rect x="${x}" y="${110-hE}" width="14" height="${hE}" fill="var(--primary)" rx="2"/>`;
    svgChart += `<rect x="${x+16}" y="${110-hS}" width="14" height="${hS}" fill="var(--danger)" rx="2"/>`;
    svgChart += `<text x="${x+14}" y="128" font-size="9" fill="currentColor" text-anchor="middle" opacity=".6">${b.label}</text>`;
  });
  svgChart += `</svg><div style="display:flex;gap:14px;font-size:11.5px;margin-top:6px"><span><span style="display:inline-block;width:9px;height:9px;background:var(--primary);border-radius:2px;margin-right:5px"></span>Entradas</span><span><span style="display:inline-block;width:9px;height:9px;background:var(--danger);border-radius:2px;margin-right:5px"></span>Saídas</span></div>`;

  document.getElementById("viewContainer").innerHTML = `
    <div class="breadcrumb">Início / Dashboard</div>
    <div class="page-title">Dashboard Executivo</div>
    ${kpiHtml}
    <div class="grid dash-grid mt16">
      <div class="panel"><div class="panel-head"><h3>Entradas x Saídas (últimos 7 dias)</h3></div>${svgChart}</div>
      <div class="panel"><div class="panel-head"><h3>Alertas</h3></div>${alertHtml}</div>
    </div>
    <div class="grid dash-grid2 mt16">
      <div class="panel"><div class="panel-head"><h3>Últimas Movimentações</h3></div>${movHtml}</div>
      <div class="panel"><div class="panel-head"><h3>Ranking — Produtos Mais Movimentados</h3></div>${rankHtml}</div>
    </div>
  `;
}

function showReport(key){
  const produtos=produtosList(), lotes=lotesList();
  let rows=[], cols=[], title="";
  if(key==="estoque_atual"){ title="Estoque Atual"; cols=["Código","Produto","Categoria","Estoque","Mínimo","Máximo","Status"];
    rows=produtos.map(p=>[p.codigo,p.nome,nomeCategoria(p.categoriaId),p.estoqueAtual,p.estoqueMin,p.estoqueMax,p.status]); }
  else if(key==="abaixo_minimo"){ title="Produtos Abaixo do Mínimo"; cols=["Código","Produto","Estoque","Mínimo"];
    rows=produtos.filter(p=>Number(p.estoqueAtual)<Number(p.estoqueMin)).map(p=>[p.codigo,p.nome,p.estoqueAtual,p.estoqueMin]); }
  else if(key==="sem_movimentacao"){ title="Produtos sem Movimentação"; cols=["Código","Produto"];
    const movIds=new Set(dbGet("movimentacoes").map(m=>String(m.produtoId)));
    rows=produtos.filter(p=>!movIds.has(String(p.id))).map(p=>[p.codigo,p.nome]); }
  else if(key==="entradas"){ title="Entradas"; cols=["Número","Data","Produto","Fornecedor","Qtd","Total"];
    rows=dbGet("entradas").map(e=>[e.numero,fmtDate(e.data),nomeProduto(e.produtoId),nomeFornecedor(e.fornecedorId),e.quantidade,fmtMoney(e.valorTotal)]); }
  else if(key==="saidas"){ title="Saídas"; cols=["Número","Data","Produto","Qtd","Centro de Custo","Responsável"];
    rows=dbGet("saidas").map(s=>[s.numero,fmtDate(s.data),nomeProduto(s.produtoId),s.quantidade,s.centroCusto,s.responsavel]); }
  else if(key==="transferencias"){ title="Transferências"; cols=["Número","Data","Produto","Origem","Destino","Qtd"];
    rows=dbGet("transferencias").map(t=>[t.numero,fmtDate(t.data),nomeProduto(t.produtoId),nomeLocalizacao(t.origemId),nomeLocalizacao(t.destinoId),t.quantidade]); }
  else if(key==="inventarios"){ title="Inventários"; cols=["Número","Data","Tipo","Produto","Sistema","Física","Diferença"];
    rows=dbGet("inventarios").map(i=>[i.numero,fmtDate(i.data),i.tipo,nomeProduto(i.produtoId),i.qtdSistema,i.qtdFisica,i.diferenca]); }
  else if(key==="por_categoria"){ title="Produtos por Categoria"; cols=["Categoria","Qtd. Produtos"];
    const map={}; produtos.forEach(p=>{ const c=nomeCategoria(p.categoriaId); map[c]=(map[c]||0)+1; });
    rows=Object.entries(map).map(([k,v])=>[k,v]); }
  else if(key==="por_fornecedor"){ title="Produtos por Fornecedor (via Entradas)"; cols=["Fornecedor","Qtd. Entradas"];
    const map={}; dbGet("entradas").forEach(e=>{ const f=nomeFornecedor(e.fornecedorId); map[f]=(map[f]||0)+1; });
    rows=Object.entries(map).map(([k,v])=>[k,v]); }
  else if(key==="por_localizacao"){ title="Produtos por Localização"; cols=["Localização","Qtd. Produtos"];
    const map={}; produtos.forEach(p=>{ const l=nomeLocalizacao(p.localizacaoId); map[l]=(map[l]||0)+1; });
    rows=Object.entries(map).map(([k,v])=>[k,v]); }
  else if(key==="vencidos"){ title="Produtos Vencidos"; cols=["Lote","Produto","Validade"];
    rows=lotes.filter(l=>daysBetween(todayISO(),l.dataValidade)<0).map(l=>[l.numeroLote,nomeProduto(l.produtoId),fmtDate(l.dataValidade)]); }
  else if(key==="proximos_validade"){ title="Produtos Próximos da Validade (90 dias)"; cols=["Lote","Produto","Validade","Dias Restantes"];
    rows=lotes.filter(l=>{const d=daysBetween(todayISO(),l.dataValidade);return d>=0&&d<=90;}).map(l=>[l.numeroLote,nomeProduto(l.produtoId),fmtDate(l.dataValidade),daysBetween(todayISO(),l.dataValidade)]); }
  else if(key==="curva_abc"){ title="Curva ABC (por valor em estoque)"; cols=["Produto","Valor em Estoque","Classe"];
    const vals = produtos.map(p=>({nome:p.nome,valor:Number(p.estoqueAtual)*Number(p.valorMedio||p.valorCompra||0)})).sort((a,b)=>b.valor-a.valor);
    const total=vals.reduce((s,v)=>s+v.valor,0)||1; let acc=0;
    rows = vals.map(v=>{ acc+=v.valor; const pct=acc/total; const classe = pct<=0.8?"A":(pct<=0.95?"B":"C"); return [v.nome,fmtMoney(v.valor),classe]; }); }
  else if(key==="giro_estoque"){ title="Giro de Estoque (saídas / estoque atual)"; cols=["Produto","Saídas Totais","Estoque Atual","Giro"];
    rows = produtos.map(p=>{ const said=dbGet("saidas").filter(s=>s.produtoId==p.id).reduce((s,x)=>s+Number(x.quantidade),0);
      const giro = p.estoqueAtual>0?(said/p.estoqueAtual).toFixed(2):"-"; return [p.nome,said,p.estoqueAtual,giro]; }); }
  else if(key==="valor_financeiro"){ title="Valor Financeiro do Estoque"; cols=["Produto","Estoque","Valor Unitário","Valor Total"];
    rows = produtos.map(p=>[p.nome,p.estoqueAtual,fmtMoney(p.valorMedio||p.valorCompra||0),fmtMoney(Number(p.estoqueAtual)*Number(p.valorMedio||p.valorCompra||0))]); }

  let html = `<div class="panel mt16"><div class="panel-head"><h3>${title}</h3>
    <div class="actions">
      <button class="btn btn-outline btn-sm" onclick="exportReportCSV('${key}')">CSV</button>
      <button class="btn btn-outline btn-sm" onclick="exportReportJSON('${key}')">JSON</button>
      <button class="btn btn-outline btn-sm" onclick="window.print()">PDF / Imprimir</button>
    </div></div>
    <div class="table-wrap"><table><thead><tr>${cols.map(c=>`<th>${c}</th>`).join("")}</tr></thead><tbody>`;
  rows.forEach(r=>{ html+=`<tr>${r.map(v=>`<td>${v}</td>`).join("")}</tr>`; });
  if(!rows.length) html+=`<tr><td colspan="${cols.length}"><div class="empty-state">Sem dados para este relatório</div></td></tr>`;
  html += `</tbody></table></div></div>`;
  document.getElementById("reportOutput").innerHTML = html;
  window._lastReport = {key,title,cols,rows};
  registrarAuditoria("Relatório",title);
}
function exportReportCSV(key){
  const r=window._lastReport; if(!r) return;
  let csv = r.cols.join(";")+"\n";
  r.rows.forEach(row=>{ csv+=row.join(";")+"\n"; });
  downloadFile(csv, key+"-"+todayISO()+".csv","text/csv");
}
function exportReportJSON(key){
  const r=window._lastReport; if(!r) return;
  downloadFile(JSON.stringify(r.rows.map(row=>{ const o={}; r.cols.forEach((c,i)=>o[c]=row[i]); return o; }),null,2), key+"-"+todayISO()+".json","application/json");
}

function limparTudo(){
  confirmModal("Isso removerá todos os registros operacionais (produtos, movimentações, cadastros, etc). Usuário administrador, configurações e estrutura serão mantidos. Deseja continuar?",()=>{

    const users = dbGet("usuarios").filter(u=>u.usuario==="Admin");
    dbSet("usuarios",users.length?users:[{id:1,nome:"Administrador do Sistema",usuario:"Admin",senha:"123",perfil:"Administrador",status:"Ativo",criadoEm:todayISO()}]);

function renderBackup(){
  document.getElementById("viewContainer").innerHTML = `
    <div class="breadcrumb">Início / Backup</div>
    <div class="page-title">Backup</div>
    <div class="panel" style="max-width:560px;text-align:center;padding:40px 24px">
      <div class="kpi-icon" style="background:var(--primary-light);color:var(--primary);margin:0 auto 16px;width:56px;height:56px">${svgIcon('download')}</div>
      <h3 style="margin-bottom:8px">Gerar Backup Completo</h3>
      <p class="text-muted mb8" style="font-size:12.8px">Exporta todos os dados do sistema (LocalStorage) em um único arquivo JSON.</p>
      <button class="btn btn-primary" onclick="gerarBackup()">Gerar Backup</button>
    </div>`;
}
function gerarBackup(){
  const backup = {};
  DB_KEYS.forEach(k=>backup[k]=dbGetObj(k, k==="configuracoes"?{}:[]));
  backup._meta = {geradoEm:new Date().toISOString(), versao:"1.0"};
  const ts = new Date();
  const name = `backup-estoque-${ts.getFullYear()}-${pad(ts.getMonth()+1,2)}-${pad(ts.getDate(),2)}-${pad(ts.getHours(),2)}-${pad(ts.getMinutes(),2)}-${pad(ts.getSeconds(),2)}.json`;
  downloadFile(JSON.stringify(backup,null,2), name, "application/json");
  registrarAuditoria("Backup","Backup");
  toast("Backup realizado com sucesso.");
}

function renderRestaurar(){
  document.getElementById("viewContainer").innerHTML = `
    <div class="breadcrumb">Início / Restaurar</div>
    <div class="page-title">Restaurar</div>
    <div class="panel" style="max-width:560px;text-align:center;padding:40px 24px">
      <div class="kpi-icon" style="background:var(--info-light);color:var(--info);margin:0 auto 16px;width:56px;height:56px">${svgIcon('upload')}</div>
      <h3 style="margin-bottom:8px">Restaurar Backup</h3>
      <p class="text-muted mb8" style="font-size:12.8px">Selecione um arquivo de backup (.json) gerado anteriormente pelo sistema.</p>
      <input type="file" id="restoreFile" accept="application/json" style="margin:14px 0">
      <br><button class="btn btn-primary" onclick="restaurarBackup()">Restaurar Backup</button>
      <p id="restoreMsg" class="mt16" style="font-size:12.8px"></p>
    </div>`;
}
function restaurarBackup(){
  const input = document.getElementById("restoreFile");
  const msg = document.getElementById("restoreMsg");
  if(!input.files.length){ msg.textContent="Selecione um arquivo primeiro."; msg.className="mt16 text-danger"; return; }
  const reader = new FileReader();
  reader.onload = function(e){
    try{
      const data = JSON.parse(e.target.result);
      confirmModal("Confirma a restauração deste backup? Todos os dados atuais serão substituídos.",()=>{
        DB_KEYS.forEach(k=>{ if(data[k]!==undefined) dbSet(k,data[k]); });
        registrarAuditoria("Restauração","Restaurar");
        toast("Backup restaurado com sucesso.");
        navigateTo("dashboard");
      });
    }catch(err){
      msg.textContent="Arquivo inválido."; msg.className="mt16 text-danger";
    }
  };
  reader.readAsText(input.files[0]);
}

/* =====================================================================

===================================================================== */
document.getElementById("globalSearch").addEventListener("input",function(){
  const q=this.value.trim().toLowerCase();
  const box=document.getElementById("searchResults");
  if(!q){ box.classList.remove("show"); box.innerHTML=""; return; }
  let results=[];
  produtosList().forEach(p=>{ if((p.nome+p.codigo+p.codigoBarras).toLowerCase().includes(q)) results.push({label:p.nome,sub:"Produto • "+p.codigo,go:()=>navigateTo("produtos")}); });
  fornecedoresList().forEach(f=>{ if((f.nomeFantasia+f.razaoSocial).toLowerCase().includes(q)) results.push({label:f.nomeFantasia,sub:"Fornecedor",go:()=>navigateTo("fornecedores")}); });
  lotesList().forEach(l=>{ if(l.numeroLote.toLowerCase().includes(q)) results.push({label:l.numeroLote,sub:"Lote • "+nomeProduto(l.produtoId),go:()=>navigateTo("lotes")}); });
  localizacoesList().forEach(l=>{ if(l.codigo.toLowerCase().includes(q)) results.push({label:l.codigo,sub:"Localização",go:()=>navigateTo("localizacoes")}); });
  dbGet("inventarios").forEach(i=>{ if(i.numero.toLowerCase().includes(q)) results.push({label:i.numero,sub:"Inventário",go:()=>navigateTo("inventarios")}); });
  results = results.slice(0,10);
  if(!results.length){ box.innerHTML=`<div class="search-result-item text-muted">Nenhum resultado encontrado</div>`; }
  else{ box.innerHTML = results.map((r,i)=>`<div class="search-result-item" onclick="globalSearchGo(${i})"><div>${r.label}</div><small>${r.sub}</small></div>`).join(""); window._searchResults=results; }
  box.classList.add("show");
});
function globalSearchGo(i){ window._searchResults[i].go(); document.getElementById("searchResults").classList.remove("show"); document.getElementById("globalSearch").value=""; }
document.addEventListener("click",e=>{ if(!e.target.closest(".topbar-search")) document.getElementById("searchResults").classList.remove("show"); });

function renderView(view){

    relatorios: renderRelatorios, configuracoes: renderConfiguracoes, backup: renderBackup,

  (map[view]||renderDashboard)();
}

function bootApp(){
  const cfg = dbGetObj("configuracoes",{});
  applyTheme(cfg.tema||"light");
  document.getElementById("brandName").textContent = cfg.nomeEmpresa || "SysSec WMS";
  const su = getSessionUser();
  if(su){
    document.getElementById("userName").textContent = su.nome || su.usuario;
    document.getElementById("userRole").textContent = su.perfil || "";
    document.getElementById("userAvatar").textContent = (su.nome||su.usuario).charAt(0).toUpperCase();
  }
  if(localStorage.getItem(SIDEBAR_KEY)==="1" && window.innerWidth>900){
    document.getElementById("sidebar").classList.add("collapsed");
    document.getElementById("mainWrap").classList.add("collapsed");
  }
  renderSidebar();
  navigateTo("dashboard");
  resetInactivityTimer();
  updateAlertDot();
}
function updateAlertDot(){
  const produtos=produtosList(); const lotes=lotesList();
  const has = produtos.some(p=>Number(p.estoqueAtual)<Number(p.estoqueMin)) || lotes.some(l=>daysBetween(todayISO(),l.dataValidade)<0);
  document.getElementById("alertDot").style.display = has?"block":"none";
}
document.getElementById("btnAlerts").onclick=()=>navigateTo("dashboard");

  if(su){
    document.getElementById("loginScreen").style.display="none";
    document.getElementById("app").style.display="block";

})();
